<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Sintonia</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2d47"/>
      <stop offset="1" stop-color="#0a121e"/>
    </linearGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62a0ea" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#b5d3f7"/>
    </linearGradient>
    <linearGradient id="agulha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe36b"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <filter id="brilho" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#fundo)"/>
  <!-- escala do dial -->
  <g stroke="#2e4a6e" stroke-width="6" stroke-linecap="round">
    <line x1="104" y1="392" x2="104" y2="412"/><line x1="136" y1="398" x2="136" y2="412"/>
    <line x1="168" y1="392" x2="168" y2="412"/><line x1="200" y1="398" x2="200" y2="412"/>
    <line x1="232" y1="392" x2="232" y2="412"/><line x1="264" y1="398" x2="264" y2="412"/>
    <line x1="328" y1="398" x2="328" y2="412"/><line x1="360" y1="392" x2="360" y2="412"/>
    <line x1="392" y1="398" x2="392" y2="412"/>
  </g>
  <!-- ruído entrando em sintonia -->
  <path d="M96 250 l12 -22 l12 40 l12 -50 l12 58 l12 -36 l12 20" fill="none" stroke="#62a0ea" stroke-opacity="0.35"
        stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M180 260 C 206 180, 236 180, 262 256 S 318 336, 344 256 S 392 176, 418 252" fill="none"
        stroke="url(#onda)" stroke-width="24" stroke-linecap="round"/>
  <!-- agulha -->
  <rect x="290" y="108" width="20" height="312" rx="10" fill="#f6d32d" opacity="0.45" filter="url(#brilho)"/>
  <rect x="294" y="108" width="12" height="312" rx="6" fill="url(#agulha)"/>
  <circle cx="300" cy="108" r="17" fill="#fbe36b"/>
</svg>
