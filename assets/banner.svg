<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="0.70" cy="0.40" r="0.62">
      <stop offset="0" stop-color="#1c3b63" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#080d16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pontos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1a2a40"/>
    </pattern>
    <filter id="borra" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1280" height="640" fill="#080d16"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#pontos)" opacity="0.8"/>
  <rect x="118" y="160" width="284" height="284" rx="70" fill="#000" opacity="0.5" filter="url(#borra)"/>
  <g transform="translate(104 142) scale(0.586)">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2d47"/>
      <stop offset="1" stop-color="#0a121e"/>
    </linearGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62a0ea" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#b5d3f7"/>
    </linearGradient>
    <linearGradient id="agulha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe36b"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <filter id="brilho" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#fundo)"/>
  <!-- escala do dial -->
  <g stroke="#2e4a6e" stroke-width="6" stroke-linecap="round">
    <line x1="104" y1="392" x2="104" y2="412"/><line x1="136" y1="398" x2="136" y2="412"/>
    <line x1="168" y1="392" x2="168" y2="412"/><line x1="200" y1="398" x2="200" y2="412"/>
    <line x1="232" y1="392" x2="232" y2="412"/><line x1="264" y1="398" x2="264" y2="412"/>
    <line x1="328" y1="398" x2="328" y2="412"/><line x1="360" y1="392" x2="360" y2="412"/>
    <line x1="392" y1="398" x2="392" y2="412"/>
  </g>
  <!-- ruído entrando em sintonia -->
  <path d="M96 250 l12 -22 l12 40 l12 -50 l12 58 l12 -36 l12 20" fill="none" stroke="#62a0ea" stroke-opacity="0.35"
        stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M180 260 C 206 180, 236 180, 262 256 S 318 336, 344 256 S 392 176, 418 252" fill="none"
        stroke="url(#onda)" stroke-width="24" stroke-linecap="round"/>
  <!-- agulha -->
  <rect x="290" y="108" width="20" height="312" rx="10" fill="#f6d32d" opacity="0.45" filter="url(#brilho)"/>
  <rect x="294" y="108" width="12" height="312" rx="6" fill="url(#agulha)"/>
  <circle cx="300" cy="108" r="17" fill="#fbe36b"/>
  </g>
  <g font-family="Inter Display, Inter, sans-serif">
    <text x="440" y="250" font-weight="800" font-size="96" fill="#f2f5fa" letter-spacing="-2">Sintonia</text>
    <text x="444" y="304" font-family="Inter, sans-serif" font-size="25" fill="#99c1f1">Programas nativos, sem Java, para equipamentos de transmissão</text>
    <text x="444" y="346" font-family="Inter, sans-serif" font-size="17" fill="#7f8ea6">Linux e Windows · lê o .jar original do equipamento · nada do fabricante no repositório</text>
  </g>
  <g font-family="Inter, sans-serif">
    <rect x="444" y="392" width="226" height="92" rx="16" fill="#10233a" stroke="#2a4a72"/>
    <text x="466" y="430" font-weight="700" font-size="24" fill="#f2f5fa">Ark-T</text>
    <text x="466" y="460" font-size="16" fill="#7f8ea6">excitadores ARK-T</text>
    <circle cx="644" cy="422" r="7" fill="#33d17a"/>
    <rect x="686" y="392" width="226" height="92" rx="16" fill="#0d1726" stroke="#1e3350" stroke-dasharray="6 5"/>
    <text x="708" y="430" font-weight="700" font-size="24" fill="#a9b6cc">ARK-6</text>
    <text x="708" y="460" font-size="16" fill="#5f6e86">em breve</text>
    <rect x="928" y="392" width="226" height="92" rx="16" fill="#0d1726" stroke="#1e3350" stroke-dasharray="6 5"/>
    <text x="950" y="430" font-weight="700" font-size="24" fill="#a9b6cc">Multiplexador</text>
    <text x="950" y="460" font-size="16" fill="#5f6e86">em breve</text>
  </g>
</svg>
